trigger:
- main

pool:
  name: dhurander
stages:
  - stage: terraforminit
    displayName: init
    jobs:
      - job: 
        displayName: terraform init
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: '1.13.4'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/anuj-infra/azure-aap'
            backendServiceArm: 'anuj-infra'
            backendAzureRmResourceGroupName: 'anuj-rg-bc'
            backendAzureRmStorageAccountName: 'anujstatefile123'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'anuj.terraform.tfstate'
